        @theme {
             --font-poppins: "Poppins", sans-serif;
             /* using in color like text-blue bg-red etc */
             --color-custom-blue: #1A9FFF;
             /* only for spacing in mt pt p m in gap  etc */
             --spacing-custom-18 :18px;
             --spacing-custom-17 :17px;
             --spacing-custom-25 :25px;
             /* for shadows only */
             --shadow-header: 0px 4px 35px 0px #00000014;
             /* it will use inside mx-w-...  */
             --container-header: 1362px;
             --z-100:100;
             /* leading or line-height in percentage */
             --leading-100:100%;
             --leading-150:150%;
             --leading-133:133%;
        }

            .peer:checked ~ .checkbox-parent .big-circle {
               background-color: #1a9fff !important;
               opacity: 10%;
            }
            .peer:checked ~ .checkbox-parent .small-circle {

            }
    </style>
