        @theme {

            --color-custom-blue: #1A9FFF;
            --spacing-custom-18: 18px;
            --spacing-custom-17: 17px;
            --spacing-custom-25: 25px;
            --shadow-header: 0px 4px 35px 0px #00000014;
            --container-header: 1362px;
            --z-100: 100;
            --leading-100: 100%;
            --leading-150: 150%;
            --leading-133: 133%;

<body class="font-poppins">

    <!-- ===== HEADER ===== -->
    <header class="pt-[9px] pb-[9px] sm:pt-custom-17 sm:pb-custom-18 shadow-header">
        <div class="container max-w-header w-full mx-auto px-4 flex items-center justify-between">

            <!-- Left -->
            <div class="h-left flex items-center gap-[18px] sm:gap-[22px] lg:gap-[63px]">

                <!-- Hamburger (mobile) -->
                <div class="lg:hidden">
                    <input type="checkbox" id="menu-toggle" class="sr-only peer">
                    <label for="menu-toggle" class="cursor-pointer relative z-100">
                        <img class="hb w-6 h-6 mr-0 sm:w-[50px] sm:h-[50px] lg:w-[24px] lg:h-[24px]"
                            src="assets/images/hamburg.png" alt="Menu" width="24" height="24">
                    </label>
                    <!-- Full-screen menu -->
                    <div
                        class="hidden peer-checked:flex fixed inset-0 z-50 bg-slate-100 flex-col items-center justify-center gap-8 w-1/2">
                        <a href="#"
                            class="opacity-60 hover:text-black hover:opacity-100 transition duration-300">Home</a>
                        <a href="#"
                            class="opacity-60 hover:text-black hover:opacity-100 transition duration-300">Contact</a>
                        <a href="#"
                            class="opacity-60 hover:text-black hover:opacity-100 transition duration-300">Feed</a>
                        <a href="#"
                            class="opacity-60 hover:text-black hover:opacity-100 transition duration-300">Wallet</a>
                    </div>
                </div>

                <!-- Logo -->
                <a href="#" class="logo">
                    <img class="w-[109.11px] h-[32px] sm:w-[218px] sm:h-auto" src="assets/images/logo.png" alt="logo"
                        width="218" height="60">
                </a>

                <!-- Nav links (desktop) -->
                <ul class="h-link hidden lg:flex gap-[59px] text-lg font-normal leading-none tracking-normal">
                    <li><a class="opacity-60 hover:text-black hover:opacity-100 transition duration-300"
                            href="#">Feed</a></li>
                    <li><a class="opacity-60 hover:text-black hover:opacity-100 transition duration-300"
                            href="#">Wallet</a></li>
                </ul>
            </div>

            <!-- Right -->
            <div class="h-right flex items-center gap-[25px]">

                <!-- Search icon (mobile) -->
                <img class="inline-block w-6 h-6 sm:w-8 sm:h-8 lg:hidden" src="assets/images/search.svg"
                    alt="search_svg" width="24" height="24">

                <!-- Search input (desktop) -->
                <input
                    class="min-w-[315px] w-full rounded-[25.5px] py-2 px-6 text-lg hidden lg:block font-normal leading-100 h-[43px] border border-[#00000033] outline-none"
                    type="text" placeholder="Search here...">

                <!-- Toggle switch -->
                <label
                    class="relative inline-block sm:min-w-[40px] sm:h-[23px] min-w-[25px] h-[14.38px] cursor-pointer">
                    <input type="checkbox" class="peer sr-only">
                    <span
                        class="absolute inset-0 rounded-full bg-[#F0F0F0] transition-colors duration-300 peer-checked:bg-black"></span>
                    <span
                        class="absolute left-[2px] sm:top-[2px] size-[14.38px] sm:size-[19px] rounded-full bg-black transition-transform duration-300 sm:peer-checked:translate-x-[17px] peer-checked:translate-x-[8px]"></span>
                </label>

                <!-- User avatar -->
                <img class="user_img w-8 h-8 sm:w-[57px] sm:h-[57px] cursor-pointer" src="assets/images/h-img.png"
                    alt="nav_img" width="57" height="57">
            </div>

        </div>
